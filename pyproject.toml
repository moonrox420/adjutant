[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adjutant"
version = "0.1.0"
description = "Adjutant advertising operations control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn[standard]==0.53.0",
  "psycopg[binary,pool]==3.3.6", "cryptography==50.0.1",
  "pydantic-settings==2.15.0", "httpx==0.28.1",
  "jsonschema[format-nongpl]==4.26.0", "email-validator>=2.2,<3",
  "google-genai==2.24.0",
  "Pillow==12.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adjutant = ["event_registry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "tests"]

[tool.pyright]
include = ["src", "scripts", "tests"]
extraPaths = ["src", "scripts", "tests"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "tests"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pycleaner]
exclude = ["migrations/", "generated/"]
line-length = 88
