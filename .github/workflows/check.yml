name: Adjutant checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: adjutant_admin
          POSTGRES_PASSWORD: ci-test-database-only
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U adjutant_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Provision dedicated development and test databases
        run: |
          mkdir -p .local
          printf '%s' 'ci-test-database-only' > .local/postgres.password
          printf '%s' 'ci-test-owner-only-12345' > .local/owner.password
          python scripts/bootstrap.py --email ci@adjutant.test --password-file .local/owner.password
      - run: ruff check src scripts tests
      - run: ruff format --check src scripts tests
      - run: pytest -q
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prettier --check app components lib tests next.config.ts playwright.config.ts
      - run: npm run build
